<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lupane Land Use & Wildlife Monitor</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- html2canvas + jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* LOGIN MODAL – your background.jpg covers the whole page */
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .login-box {
            background: rgba(0,0,0,0.65);
            width: 450px;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            backdrop-filter: blur(4px);
            border: 2px solid #ffd700;
        }
        .login-box h2 { color: #ffd700; margin-bottom: 15px; font-size: 24px; }
        .welcome-msg { color: #f0f0f0; font-size: 14px; margin-bottom: 20px; }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: none;
            border-radius: 40px;
            background: rgba(255,255,255,0.9);
            text-align: center;
        }
        .login-box button {
            background: #1a3c2c;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }
        .login-box button:hover { background: #2e7d32; }
        .error-msg { color: #ffaaaa; margin-top: 10px; }

        .map-container { display: none; height: 100vh; width: 100%; }
        #map { height: calc(100vh - 75px); width: 100%; }

        /* HEADER */
        .header {
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            color: white;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 75px;
            border-bottom: 4px solid #8b5a2b;
        }
        .header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 0;
        }
        .header .map-title, .header .icon-group, .header .basemap-switcher, .header > div {
            position: relative;
            z-index: 1;
        }
        .map-title { font-size: 1.4rem; font-weight: bold; text-shadow: 1px 1px 2px #000; color: white; }
        .icon-group { display: flex; gap: 20px; align-items: center; }
        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
            position: relative;
        }
        .basemap-switcher {
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 30px;
            font-size: 14px;
            display: flex;
            gap: 15px;
        }
        .basemap-switcher label { cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .basemap-switcher input { cursor: pointer; }
        .icon-btn:hover, .layer-control button:hover, .layer-control select:hover, .report-panel button:hover, #encroachBtn:hover {
            animation: bigBlink 0.8s infinite;
        }
        @keyframes bigBlink {
            0% { text-shadow: 0 0 0 #4caf50; box-shadow: 0 0 0 #4caf50; }
            50% { text-shadow: 0 0 12px #4caf50, 0 0 20px #2e7d32; box-shadow: 0 0 15px #4caf50; }
            100% { text-shadow: 0 0 0 #4caf50; box-shadow: 0 0 0 #4caf50; }
        }
        .lang-select {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Layer control (same as before) */
        .layer-control {
            position: absolute;
            top: 90px;
            right: 20px;
            background: rgba(200,200,200,0.8);
            backdrop-filter: blur(4px);
            padding: 12px;
            border-radius: 10px;
            z-index: 1000;
            min-width: 220px;
            border: 2px solid #4caf50;
            animation: blinkBorder 1.5s infinite;
        }
        @keyframes blinkBorder {
            0% { border-color: #4caf50; box-shadow: 0 0 0 #4caf50; }
            50% { border-color: #a5d6a7; box-shadow: 0 0 12px #4caf50; }
            100% { border-color: #4caf50; box-shadow: 0 0 0 #4caf50; }
        }
        .layer-control button, .layer-control select {
            display: block;
            width: 100%;
            margin: 6px 0;
            padding: 8px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .layer-control button:hover, .layer-control select:hover { background: #1abc9c; }
        .layer-control hr { margin: 10px 0; border-color: #aaa; }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            backdrop-filter: blur(4px);
            max-width: 280px;
            z-index: 1000;
            display: none;
        }
        .legend span { display: inline-block; width: 18px; height: 18px; margin-right: 8px; border-radius: 3px; }

        /* Report panel (draggable) */
        .report-panel {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(100,100,100,0.9);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 12px;
            width: 340px;
            z-index: 1001;
            color: white;
            font-size: 13px;
            border: 1px solid #ccc;
            display: none;
            cursor: move;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .report-panel .panel-header {
            cursor: move;
            background: rgba(0,0,0,0.5);
            margin: -15px -15px 10px -15px;
            padding: 10px 15px;
            border-radius: 12px 12px 0 0;
            font-weight: bold;
        }
        .report-panel input, .report-panel select, .report-panel textarea {
            width: 100%;
            margin: 6px 0;
            padding: 6px;
            border-radius: 5px;
            border: none;
        }
        .report-panel button {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        .report-panel button:hover { background: #b71c1c; }
        .report-panel .close-btn { background: #555; margin-top: 10px; }
        .coord-row { display: flex; justify-content: space-between; gap: 8px; margin: 6px 0; }
        .coord-row button { flex: 1; margin-top: 0; background: #2c3e50; }
        .coord-row button:hover { background: #1abc9c; }

        /* Graphs panel – collapsible */
        .graphs-panel {
            position: absolute;
            top: 90px;
            left: 20px;
            background: rgba(30,30,30,0.95);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            width: 400px;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 1000;
            color: white;
            padding: 12px;
            border: 1px solid #4caf50;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .graphs-panel h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            text-align: center;
            border-bottom: 1px solid #4caf50;
        }
        .graph-container {
            margin-bottom: 25px;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 8px;
        }
        .graph-container canvas {
            max-height: 200px;
            width: 100%;
        }
        .close-graphs {
            float: right;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .notification-badge {
            position: absolute;
            top: -8px;
            right: -12px;
            background: red;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
        }
        @media (max-width: 700px) {
            .layer-control { min-width: 170px; right: 10px; top: 75px; }
            .report-panel { width: 280px; right: 10px; bottom: 10px; }
            .graphs-panel { width: 300px; left: 10px; top: 75px; }
            .map-title { font-size: 1rem; }
            .basemap-switcher { font-size: 10px; gap: 8px; padding: 3px 6px; }
        }
    </style>
</head>
<body>

<!-- LOGIN MODAL -->
<div id="loginModal" class="login-modal">
    <div class="login-box">
        <h2>LUPANE LAND USE & WILDLIFE MONITOR</h2>
        <div class="welcome-msg">Welcome back, please login with your credentials to access the web map.</div>
        <input type="text" id="username" placeholder="Username" autocomplete="off">
        <input type="password" id="password" placeholder="Password" autocomplete="off">
        <button id="loginBtn">Enter Map</button>
        <div id="loginError" class="error-msg"></div>
    </div>
</div>

<!-- MAIN MAP INTERFACE -->
<div id="mapContainer" class="map-container">
    <div class="header">
        <div class="icon-group">
            <button class="icon-btn" id="menuIcon"><i class="fas fa-bars"></i></button>
            <button class="icon-btn" id="reportIcon"><i class="fas fa-edit"></i></button>
            <button class="icon-btn" id="graphsIcon"><i class="fas fa-chart-line"></i></button>
            <button class="icon-btn" id="exportPdfIcon"><i class="fas fa-file-pdf"></i></button>
            <button class="icon-btn" id="notifyIcon"><i class="fas fa-bell"></i><span class="notification-badge" id="notifBadge">0</span></button>
            <select id="languageSelect" class="lang-select">
                <option value="en">English</option><option value="ar">العربية</option><option value="zh">中文</option>
                <option value="pt">Português</option><option value="fr">Français</option>
            </select>
        </div>
        <div class="map-title">LUPANE LAND USE & WILDLIFE MONITOR</div>
        <div class="basemap-switcher">
            <label><input type="radio" name="basemap" value="map" checked> 🗺️ Map</label>
            <label><input type="radio" name="basemap" value="satellite"> 🛰️ Satellite</label>
        </div>
    </div>
    <div id="map"></div>
    <div class="legend" id="legendPanel"></div>
    <div class="layer-control" id="layerControl">
        <strong>LAYERS</strong><hr>
        <select id="lulcDropdown">
            <option value="">-- LAND USE LAND COVER --</option>
            <option value="2010">LAND USE LAND COVER 2010</option>
            <option value="2015">LAND USE LAND COVER 2015</option>
            <option value="2020">LAND USE LAND COVER 2020</option>
            <option value="2026">LAND USE LAND COVER 2026</option>
        </select>
        <button id="lupaneDistrictBtn">LUPANE BOUNDARY DISTRICT</button>
        <button id="nationalParksBtn">NATIONAL PARKS</button>
        <button id="protectedAreasBtn">PROTECTED AREAS WITHIN LUPANE</button>
        <button id="farmBoundariesBtn">LUPANE FARM BOUNDARIES</button>
        <button id="riversBtn">RIVERS</button>
        <button id="waterLinesBtn">WATER LINES</button>
        <button id="roadsBtn">ROADS (styled)</button>
        <button id="damsBtn">DAMS</button>
        <hr>
        <button id="encroachBtn">CHECK FARM ENCROACHMENT</button>
    </div>
    <div class="report-panel" id="reportPanel">
        <div class="panel-header">📢 Report Human-Wildlife Conflict</div>
        <textarea id="reportDesc" rows="2" placeholder="What happened?"></textarea>
        <select id="damageSelect">
            <option value="">-- Select damage level --</option>
            <option value="low">Low</option>
            <option value="moderate">Moderate</option>
            <option value="high">High</option>
            <option value="very high">Very High</option>
        </select>
        <div class="coord-row">
            <button id="getLocationBtn">📍 Use My GPS</button>
            <button id="pickMapBtn">🗺️ Pick on Map</button>
        </div>
        <span id="coordsDisplay" style="font-size:10px;">No location selected</span>
        <button id="submitReportBtn">Submit Report</button>
        <button id="closeReportBtn" class="close-btn">Close</button>
    </div>

    <!-- GRAPHS PANEL (collapsible) -->
    <div class="graphs-panel" id="graphsPanel">
        <button class="close-graphs" id="closeGraphsBtn">&times;</button>
        <h3>📊 Land Use Change Statistics</h3>
        <div class="graph-container">
            <canvas id="farmlandExpansionChart" width="400" height="200"></canvas>
        </div>
        <div class="graph-container">
            <canvas id="forestLossChart" width="400" height="200"></canvas>
        </div>
        <div class="graph-container">
            <canvas id="waterChangeChart" width="400" height="200"></canvas>
        </div>
        <div class="graph-container">
            <canvas id="landUsePieChart" width="400" height="200"></canvas>
        </div>
        <div class="graph-container">
            <canvas id="barComparisonChart" width="400" height="200"></canvas>
        </div>
        <p style="font-size:10px; text-align:center;">Data source: lulc_stats.csv (farmland, forest, water, etc.)</p>
    </div>
</div>

<script>
    // ==================== LOGIN ====================
    const loginModal = document.getElementById('loginModal');
    const mapContainer = document.getElementById('mapContainer');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const correctUser = 'web gis', correctPass = '@2026';

    loginBtn.onclick = () => {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        if (u === correctUser && p === correctPass) {
            loginModal.style.display = 'none';
            mapContainer.style.display = 'block';
            initMap();
        } else loginError.innerText = 'Invalid username or password.';
    };
    document.addEventListener('keypress', e => { if(e.key==='Enter' && loginModal.style.display!=='none') loginBtn.click(); });

    // ==================== GLOBAL VARIABLES ====================
    let map, activeLayers = {};
    let conflictMarkers = [], heatLayer;
    let notificationCount = 0;
    let currentSelectedLocation = null;
    let pickingActive = false;
    let currentBaseLayer = null;
    let currentLulcLayer = null;

    // Chart instances
    let farmlandChart, forestChart, waterChart, pieChart, barChart;

    // Basemaps
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    });
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
    });

    function switchBaseLayer(type) {
        if (currentBaseLayer) map.removeLayer(currentBaseLayer);
        currentBaseLayer = (type === 'map') ? osmLayer : satelliteLayer;
        currentBaseLayer.addTo(map);
    }

    // LULC render function (QGIS style)
    function renderLULC(data, ctx, canvasWidth, canvasHeight) {
        const w = data[0].length;
        const h = data.length;
        const imgData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
        for (let i = 0; i < h; i++) {
            for (let j = 0; j < w; j++) {
                let val = Math.round(data[i][j]);
                let r, g, b, a = 255;
                switch(val) {
                    case 0: r=35; g=17; b=231; break;     // Water
                    case 1: r=62; g=160; b=23; break;     // Crop
                    case 2: r=3; g=19; b=5; break;        // Built-up
                    case 3: r=21; g=18; b=1; a=168; break;// Rocky
                    case 4: r=142; g=109; b=32; break;    // Bare
                    case 5: r=4; g=65; b=10; break;       // Forest
                    case 6: r=196; g=175; b=16; break;    // Roads
                    default: r=128; g=128; b=128; a=128;
                }
                const idx = (i * canvasWidth + j) * 4;
                imgData.data[idx] = r;
                imgData.data[idx+1] = g;
                imgData.data[idx+2] = b;
                imgData.data[idx+3] = a;
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    // Load LULC GeoTIFF from Cloud Storage or local
    function loadLulcYear(year, url) {
        if (currentLulcLayer) map.removeLayer(currentLulcLayer);
        if (!url) return;
        currentLulcLayer = L.leafletGeotiff(url, {
            renderer: L.leafletGeotiff.vectorTile({
                render: function(data, canvas, ctx) {
                    renderLULC(data, ctx, canvas.width, canvas.height);
                }
            })
        }).addTo(map);
        updateLegend();
    }

    // ==================== GRAPHS FROM CSV ====================
    async function loadAndRenderGraphs() {
        try {
            const response = await fetch('lulc_stats.csv');
            const csvText = await response.text();
            const rows = csvText.trim().split('\n');
            const headers = rows[0].split(',');
            const years = [];
            const farmland = [];
            const forest = [];
            const water = [];
            const grassland = [];
            const urban = [];
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].split(',');
                if (cols.length < 6) continue;
                years.push(parseInt(cols[0]));
                farmland.push(parseFloat(cols[1]));
                forest.push(parseFloat(cols[2]));
                water.push(parseFloat(cols[3]));
                grassland.push(parseFloat(cols[4]));
                urban.push(parseFloat(cols[5]));
            }
            // Farmland expansion (line + bar will be separate)
            if (farmlandChart) farmlandChart.destroy();
            const ctxFarm = document.getElementById('farmlandExpansionChart').getContext('2d');
            farmlandChart = new Chart(ctxFarm, {
                type: 'line',
                data: { labels: years, datasets: [{ label: 'Farmland Area (ha)', data: farmland, borderColor: '#f9a825', backgroundColor: 'rgba(249,168,37,0.2)', fill: true, tension: 0.3 }] },
                options: { responsive: true, plugins: { legend: { position: 'top' }, title: { display: true, text: 'Farmland Expansion (2000-2026)' } } }
            });
            // Forest loss
            if (forestChart) forestChart.destroy();
            const ctxForest = document.getElementById('forestLossChart').getContext('2d');
            forestChart = new Chart(ctxForest, {
                type: 'line',
                data: { labels: years, datasets: [{ label: 'Forest Area (ha)', data: forest, borderColor: '#2e7d32', backgroundColor: 'rgba(46,125,50,0.2)', fill: true }] },
                options: { responsive: true, plugins: { title: { display: true, text: 'Forest Cover Loss Over Time' } } }
            });
            // Water change
            if (waterChart) waterChart.destroy();
            const ctxWater = document.getElementById('waterChangeChart').getContext('2d');
            waterChart = new Chart(ctxWater, {
                type: 'line',
                data: { labels: years, datasets: [{ label: 'Water Bodies (ha)', data: water, borderColor: '#1565c0', backgroundColor: 'rgba(21,101,192,0.2)', fill: true }] },
                options: { responsive: true, plugins: { title: { display: true, text: 'Water Extent Change' } } }
            });
            // Pie chart for most recent year
            const lastIdx = years.length - 1;
            const pieData = {
                labels: ['Farmland', 'Forest', 'Grassland', 'Water', 'Urban'],
                datasets: [{ data: [farmland[lastIdx], forest[lastIdx], grassland[lastIdx], water[lastIdx], urban[lastIdx]], backgroundColor: ['#f9a825','#2e7d32','#8bc34a','#1565c0','#c62828'] }]
            };
            if (pieChart) pieChart.destroy();
            const ctxPie = document.getElementById('landUsePieChart').getContext('2d');
            pieChart = new Chart(ctxPie, { type: 'pie', data: pieData, options: { responsive: true, plugins: { title: { display: true, text: `Land Use Distribution (${years[lastIdx]})` } } } });
            // Bar chart comparison (farmland vs forest over years)
            if (barChart) barChart.destroy();
            const ctxBar = document.getElementById('barComparisonChart').getContext('2d');
            barChart = new Chart(ctxBar, {
                type: 'bar',
                data: { labels: years, datasets: [{ label: 'Farmland (ha)', data: farmland, backgroundColor: '#f9a825' }, { label: 'Forest (ha)', data: forest, backgroundColor: '#2e7d32' }] },
                options: { responsive: true, plugins: { title: { display: true, text: 'Farmland vs Forest Comparison' } }, scales: { y: { beginAtZero: true } } }
            });
        } catch (err) {
            console.warn('Could not load lulc_stats.csv', err);
            document.querySelector('.graphs-panel').innerHTML += '<p style="color:red;">Error loading CSV. Please ensure lulc_stats.csv is in the same folder.</p>';
        }
    }

    // ==================== PDF EXPORT ====================
    async function exportToPDF() {
        const { jsPDF } = window.jspdf;
        const element = document.getElementById('mapContainer');
        const originalOverflow = element.style.overflow;
        element.style.overflow = 'visible';
        try {
            const canvas = await html2canvas(element, { scale: 2, logging: false, useCORS: true });
            const imgData = canvas.toDataURL('image/png');
            const pdf = new jsPDF('landscape', 'mm', 'a4');
            const imgWidth = 297;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
            pdf.save('lupane_map_report.pdf');
        } catch (err) {
            alert('PDF export failed: ' + err);
        } finally {
            element.style.overflow = originalOverflow;
        }
    }

    // ==================== MAP INITIALIZATION ====================
    function initMap() {
        map = L.map('map').setView([-18.92, 27.55], 10);
        currentBaseLayer = osmLayer;
        currentBaseLayer.addTo(map);

        // Basemap switcher
        document.querySelector('input[value="map"]').addEventListener('change', () => switchBaseLayer('map'));
        document.querySelector('input[value="satellite"]').addEventListener('change', () => switchBaseLayer('satellite'));

        // Fallback boundary
        const fallbackBoundary = L.polygon([
            [27.40, -18.80], [27.65, -18.80], [27.70, -18.90],
            [27.65, -19.05], [27.40, -19.05], [27.35, -18.95], [27.40, -18.80]
        ], { color: '#e63946', weight: 4, fillOpacity: 0, dashArray: '8,8' }).addTo(map);
        fallbackBoundary.bindPopup("Lupane District (fallback)");
        activeLayers.lupaneDistrict = fallbackBoundary;
        activeLayers.lupaneDistrictFallback = true;

        fetch('LUPANE BOUNDARY DISTRICT.geojson')
            .then(r => r.json())
            .then(data => {
                map.removeLayer(fallbackBoundary);
                const realBoundary = L.geoJSON(data, { style: { color: '#060509', weight: 3, fillOpacity: 0 }, onEachFeature: (f,l) => l.bindPopup(f.properties.DISTRICT || 'Lupane') });
                activeLayers.lupaneDistrict = realBoundary;
                delete activeLayers.lupaneDistrictFallback;
                realBoundary.addTo(map);
                updateLegend();
            })
            .catch(() => console.warn("Using fallback boundary"));

        // Load other GeoJSON layers (simplified for brevity, but keep existing)
        function loadOtherGeoJSON(name, url, style, popupField='name') {
            fetch(url).then(r=>r.json()).then(data=>{
                activeLayers[name] = L.geoJSON(data, { style: style, onEachFeature: (f,l)=>{ if(f.properties) l.bindPopup(f.properties[popupField] || name); } });
            }).catch(e=>console.warn(`Could not load ${url}`, e));
        }
        loadOtherGeoJSON('nationalParks', 'NATIONAL PARKS.geojson', { color: '#ff6600', weight: 2, fillOpacity: 0.3 });
        loadOtherGeoJSON('protectedAreas', 'PROTECTED AREAS WITHIN LUPANE.geojson', { color: '#00ced1', weight: 2, fillOpacity: 0.3 });
        loadOtherGeoJSON('farmBoundaries', 'LUPANE COMMUNAL FARM BOUNDARIES.geojson', { color: '#cddc39', weight: 2, fillOpacity: 0.4 });
        loadOtherGeoJSON('rivers', 'RIVERS.geojson', { color: '#1e88e5', weight: 2, fillOpacity: 0 });
        loadOtherGeoJSON('waterLines', 'WATER LINES.geojson', { color: '#42a5f5', weight: 2, fillOpacity: 0 });
        loadOtherGeoJSON('roads', 'ROADS.geojson', { color: '#DB1E2A', weight: 2, dashArray: '4,12', lineCap: 'round' });
        loadOtherGeoJSON('dams', 'DAM.geojson', { color: '#232323', weight: 1, fillColor: '#0000FF', fillOpacity: 0.8 });

        // LULC URLs (update with your COG links)
        const lulcUrls = {
            2010: 'https://storage.googleapis.com/lupane_lulc_cogs/lulc_2010.tif',
            2015: 'https://storage.googleapis.com/lupane_lulc_cogs/lulc_2015.tif',
            2020: 'https://storage.googleapis.com/lupane_lulc_cogs/lulc_2020.tif',
            2026: 'https://storage.googleapis.com/lupane_lulc_cogs/lulc_2026.tif'
        };

        document.getElementById('lulcDropdown').onchange = (e) => {
            const val = e.target.value;
            if (val === '2010') loadLulcYear(2010, lulcUrls[2010]);
            else if (val === '2015') loadLulcYear(2015, lulcUrls[2015]);
            else if (val === '2020') loadLulcYear(2020, lulcUrls[2020]);
            else if (val === '2026') loadLulcYear(2026, lulcUrls[2026]);
            else { if (currentLulcLayer) map.removeLayer(currentLulcLayer); currentLulcLayer = null; updateLegend(); }
        };

        function toggleLayer(name) {
            if (!activeLayers[name]) { alert(`Layer ${name} not loaded yet`); return; }
            if (map.hasLayer(activeLayers[name])) map.removeLayer(activeLayers[name]);
            else map.addLayer(activeLayers[name]);
            updateLegend();
        }
        document.getElementById('lupaneDistrictBtn').onclick = () => toggleLayer('lupaneDistrict');
        document.getElementById('nationalParksBtn').onclick = () => toggleLayer('nationalParks');
        document.getElementById('protectedAreasBtn').onclick = () => toggleLayer('protectedAreas');
        document.getElementById('farmBoundariesBtn').onclick = () => toggleLayer('farmBoundaries');
        document.getElementById('riversBtn').onclick = () => toggleLayer('rivers');
        document.getElementById('waterLinesBtn').onclick = () => toggleLayer('waterLines');
        document.getElementById('roadsBtn').onclick = () => toggleLayer('roads');
        document.getElementById('damsBtn').onclick = () => toggleLayer('dams');

        function updateLegend() {
            const legendDiv = document.getElementById('legendPanel');
            let content = '';
            const lulcVisible = currentLulcLayer && map.hasLayer(currentLulcLayer);
            if (lulcVisible) {
                content += `<strong>LAND COVER (QGIS style)</strong><br>
                    <p><span style="background:#2311e7;"></span> Water</p>
                    <p><span style="background:#3ea017;"></span> Crop Fields</p>
                    <p><span style="background:#031305;"></span> Built up Area</p>
                    <p><span style="background:#151201;"></span> Rocky Area</p>
                    <p><span style="background:#8e6d20;"></span> Bare Land</p>
                    <p><span style="background:#04410a;"></span> Forest</p>
                    <p><span style="background:#c4af10;"></span> Roads</p><hr>`;
            }
            if (activeLayers.lupaneDistrict && map.hasLayer(activeLayers.lupaneDistrict)) {
                content += `<strong>LUPANE BOUNDARY</strong><br><p><span style="background:#060509;"></span> Boundary</p><hr>`;
            }
            if (activeLayers.nationalParks && map.hasLayer(activeLayers.nationalParks)) content += `<strong>NATIONAL PARKS</strong><br><p><span style="background:#ff6600;"></span> Park area</p><hr>`;
            if (activeLayers.protectedAreas && map.hasLayer(activeLayers.protectedAreas)) content += `<strong>PROTECTED AREAS</strong><br><p><span style="background:#00ced1;"></span> Protected zone</p><hr>`;
            if (activeLayers.farmBoundaries && map.hasLayer(activeLayers.farmBoundaries)) content += `<strong>FARM BOUNDARIES</strong><br><p><span style="background:#cddc39;"></span> Agricultural fields</p><hr>`;
            if (activeLayers.rivers && map.hasLayer(activeLayers.rivers)) content += `<strong>RIVERS</strong><br><p><span style="background:#1e88e5;"></span> River lines</p><hr>`;
            if (activeLayers.waterLines && map.hasLayer(activeLayers.waterLines)) content += `<strong>WATER LINES</strong><br><p><span style="background:#42a5f5;"></span> Watercourses</p><hr>`;
            if (activeLayers.roads && map.hasLayer(activeLayers.roads)) content += `<strong>ROADS</strong><br><p><span style="background:#DB1E2A;"></span> Roads (dashed)</p><hr>`;
            if (activeLayers.dams && map.hasLayer(activeLayers.dams)) content += `<strong>DAMS</strong><br><p><span style="background:#0000FF;"></span> Dam / Reservoir</p><hr>`;
            if (content) { legendDiv.innerHTML = content; legendDiv.style.display = 'block'; }
            else legendDiv.style.display = 'none';
        }

        // Conflict reporting (minimal, same as before)
        let conflictPoints = [];
        function updateHeatmap() {
            if (heatLayer) map.removeLayer(heatLayer);
            heatLayer = L.heatLayer(conflictPoints, { radius: 25, blur: 15, maxZoom: 17 });
            heatLayer.addTo(map);
        }
        function addConflictReport(lat, lng, desc, rating) {
            let intensity = rating==='low'?0.3 : rating==='moderate'?0.6 : rating==='high'?0.8 : 1.0;
            conflictPoints.push([lat, lng, intensity]);
            updateHeatmap();
            L.marker([lat, lng]).addTo(map).bindPopup(`<b>Conflict Report</b><br>${desc}<br>Rating: ${rating}`);
            showNotification(`New conflict report: ${desc} (${rating})`);
        }

        // Report panel draggable (same as before)
        const reportPanel = document.getElementById('reportPanel');
        const dragHandle = reportPanel.querySelector('.panel-header');
        let offsetX, offsetY, startX, startY;
        dragHandle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            startX = e.clientX;
            startY = e.clientY;
            offsetX = reportPanel.offsetLeft;
            offsetY = reportPanel.offsetTop;
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
        function onMouseMove(e) {
            let dx = e.clientX - startX;
            let dy = e.clientY - startY;
            let left = offsetX + dx;
            let top = offsetY + dy;
            left = Math.min(window.innerWidth - reportPanel.offsetWidth - 10, Math.max(10, left));
            top = Math.min(window.innerHeight - reportPanel.offsetHeight - 10, Math.max(10, top));
            reportPanel.style.left = left + 'px';
            reportPanel.style.right = 'auto';
            reportPanel.style.bottom = 'auto';
            reportPanel.style.top = top + 'px';
        }
        function onMouseUp() { document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp); }

        const reportIcon = document.getElementById('reportIcon');
        const closeReport = document.getElementById('closeReportBtn');
        const coordsSpan = document.getElementById('coordsDisplay');
        let tempMarker = null;
        function setLocation(lat, lng) {
            currentSelectedLocation = { lat, lng };
            coordsSpan.innerText = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
            if (tempMarker) map.removeLayer(tempMarker);
            tempMarker = L.marker([lat, lng]).addTo(map).bindPopup('Report location').openPopup();
        }
        document.getElementById('getLocationBtn').onclick = () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => setLocation(pos.coords.latitude, pos.coords.longitude), () => alert('Geolocation failed'));
            } else alert('Not supported');
        };
        document.getElementById('pickMapBtn').onclick = () => {
            pickingActive = true;
            map.getContainer().style.cursor = 'crosshair';
            alert('Click on map to select location');
        };
        map.on('click', (e) => {
            if (pickingActive) { setLocation(e.latlng.lat, e.latlng.lng); pickingActive = false; map.getContainer().style.cursor = ''; }
        });
        document.getElementById('submitReportBtn').onclick = () => {
            let desc = document.getElementById('reportDesc').value;
            let damage = document.getElementById('damageSelect').value;
            if (!desc || !damage) { alert('Fill description and damage level.'); return; }
            if (!currentSelectedLocation) { alert('Select location.'); return; }
            addConflictReport(currentSelectedLocation.lat, currentSelectedLocation.lng, desc, damage);
            alert('Report submitted!');
            document.getElementById('reportDesc').value = '';
            document.getElementById('damageSelect').value = '';
            currentSelectedLocation = null;
            coordsSpan.innerText = 'No location selected';
            if (tempMarker) map.removeLayer(tempMarker);
            tempMarker = null;
            reportPanel.style.display = 'none';
        };
        reportIcon.onclick = () => {
            reportPanel.style.display = 'block';
            if (!reportPanel.style.left) { reportPanel.style.right = '20px'; reportPanel.style.bottom = '80px'; reportPanel.style.left = 'auto'; reportPanel.style.top = 'auto'; }
        };
        closeReport.onclick = () => reportPanel.style.display = 'none';

        function showNotification(msg) {
            if (Notification.permission === 'granted') new Notification('Lupane Monitor', { body: msg });
            else if (Notification.permission !== 'denied') Notification.requestPermission().then(perm => { if (perm === 'granted') new Notification('Lupane Monitor', { body: msg }); });
            else alert(msg);
            notificationCount++;
            document.getElementById('notifBadge').innerText = notificationCount;
        }
        document.getElementById('notifyIcon').onclick = () => { notificationCount = 0; document.getElementById('notifBadge').innerText = '0'; };

        // Encroachment detection (simplified)
        async function checkEncroachment() {
            alert('Encroachment check: function placeholder');
        }
        document.getElementById('encroachBtn').onclick = checkEncroachment;
        document.getElementById('menuIcon').onclick = () => {
            const panel = document.getElementById('layerControl');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        };

        // Graphs panel toggle and load data
        const graphsPanel = document.getElementById('graphsPanel');
        const graphsIcon = document.getElementById('graphsIcon');
        const closeGraphsBtn = document.getElementById('closeGraphsBtn');
        graphsIcon.onclick = () => {
            if (graphsPanel.style.display === 'none' || !graphsPanel.style.display) {
                graphsPanel.style.display = 'block';
                loadAndRenderGraphs();
            } else {
                graphsPanel.style.display = 'none';
            }
        };
        closeGraphsBtn.onclick = () => graphsPanel.style.display = 'none';

        // PDF export
        const exportPdfIcon = document.getElementById('exportPdfIcon');
        exportPdfIcon.onclick = exportToPDF;

        updateHeatmap();
        map.fitBounds([[-19.05,27.35],[-18.80,27.70]]);
    }
</script>
</body>
</html>
