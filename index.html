<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lupane Land Use & Wildlife Monitor</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* LOGIN */
        .login-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('background.jpg');
            background-size: cover;
        }

        .login-box {
            background: rgba(0,0,0,0.65);
            width: 450px;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            border: 2px solid #ffd700;
        }

        .map-container { display: none; height: 100vh; width: 100%; }
        #map { height: calc(100vh - 75px); width: 100%; }

        /* HEADER */
        .header {
            background-image: url('background.jpg');
            height: 75px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: white;
        }

        .map-title { font-weight: bold; font-size: 18px; }

        .icon-group { display: flex; gap: 15px; }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        /* GRAPH PANEL (NEW) */
        #graphPanel {
            position: absolute;
            top: 90px;
            left: 20px;
            width: 380px;
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px;
            border-radius: 12px;
            z-index: 4000;
            display: none;
        }

        canvas { background: transparent; }
    </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginModal" class="login-modal">
    <div class="login-box">
        <h2>LUPANE LAND USE & WILDLIFE MONITOR</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button id="loginBtn">Enter Map</button>
    </div>
</div>

<!-- MAIN MAP -->
<div id="mapContainer" class="map-container">

    <div class="header">
        <div class="icon-group">
            <button class="icon-btn" id="menuIcon"><i class="fas fa-bars"></i></button>
            <button class="icon-btn" id="reportIcon"><i class="fas fa-edit"></i></button>

            <!-- NEW GRAPH BUTTON -->
            <button class="icon-btn" id="graphIcon">
                <i class="fas fa-chart-line"></i>
            </button>

        </div>

        <div class="map-title">LUPANE LAND USE & WILDLIFE MONITOR</div>
    </div>

    <div id="map"></div>

    <!-- GRAPH PANEL (NEW ADDED ONLY) -->
    <div id="graphPanel">
        <h3>📊 LULC Change Analysis</h3>
        <canvas id="lineChart"></canvas>
        <hr>
        <canvas id="barChart"></canvas>
        <hr>
        <canvas id="pieChart"></canvas>
    </div>

</div>

<script>
let map;

// LOGIN
document.getElementById('loginBtn').onclick = function () {
    document.getElementById('loginModal').style.display = 'none';
    document.getElementById('mapContainer').style.display = 'block';
    initMap();
};

// MAP INIT (YOUR ORIGINAL SYSTEM PRESERVED)
function initMap() {
    map = L.map('map').setView([-18.92, 27.55], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // ======================
    // GRAPH DATA (NEW ONLY)
    // ======================
    const lulcData = [
        { year: 2018, farmland: 1200, forest: 3400, water: 500 },
        { year: 2019, farmland: 1350, forest: 3200, water: 480 },
        { year: 2020, farmland: 1500, forest: 3000, water: 460 },
        { year: 2021, farmland: 1700, forest: 2800, water: 450 },
        { year: 2022, farmland: 1850, forest: 2600, water: 430 },
        { year: 2023, farmland: 2000, forest: 2400, water: 420 },
        { year: 2024, farmland: 2150, forest: 2200, water: 410 }
    ];

    // ======================
    // GRAPH TOGGLE
    // ======================
    document.getElementById('graphIcon').onclick = function () {
        const panel = document.getElementById('graphPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        drawGraphs(lulcData);
    };

    // ======================
    // DRAW GRAPHS
    // ======================
    function drawGraphs(data) {

        // LINE GRAPH
        new Chart(document.getElementById('lineChart'), {
            type: 'line',
            data: {
                labels: data.map(d => d.year),
                datasets: [
                    { label: 'Farmland', data: data.map(d => d.farmland), borderColor: 'yellow' },
                    { label: 'Forest', data: data.map(d => d.forest), borderColor: 'green' },
                    { label: 'Water', data: data.map(d => d.water), borderColor: 'blue' }
                ]
            }
        });

        // BAR GRAPH
        new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels: data.map(d => d.year),
                datasets: [{
                    label: 'Farmland',
                    data: data.map(d => d.farmland),
                    backgroundColor: 'orange'
                }]
            }
        });

        // PIE CHART (LATEST YEAR)
        const latest = data[data.length - 1];

        new Chart(document.getElementById('pieChart'), {
            type: 'pie',
            data: {
                labels: ['Farmland', 'Forest', 'Water'],
                datasets: [{
                    data: [latest.farmland, latest.forest, latest.water],
                    backgroundColor: ['yellow', 'green', 'blue']
                }]
            }
        });
    }
}
</script>

</body>
</html>
