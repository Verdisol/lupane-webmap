<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lupane Land Use & Wildlife Monitor</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .login-box {
            background: rgba(0,0,0,0.65);
            width: 450px;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            backdrop-filter: blur(4px);
            border: 2px solid #ffd700;
        }

        .login-box h2 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .welcome-msg {
            color: #f0f0f0;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: none;
            border-radius: 40px;
            background: rgba(255,255,255,0.9);
            text-align: center;
        }

        .login-box button {
            background: #1a3c2c;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        .login-box button:hover {
            background: #2e7d32;
        }

        .error-msg {
            color: #ffaaaa;
            margin-top: 10px;
        }

        .map-container {
            display: none;
            height: 100vh;
            width: 100%;
        }

        #map {
            height: calc(100vh - 75px);
            width: 100%;
        }

        .header {
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            color: white;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 75px;
            border-bottom: 4px solid #8b5a2b;
        }

        .header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 0;
        }

        .header .map-title,
        .header .icon-group,
        .header .basemap-switcher,
        .header > div {
            position: relative;
            z-index: 1;
        }

        .map-title {
            font-size: 1.4rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            color: white;
        }

        .icon-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
            position: relative;
        }

        .basemap-switcher {
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 30px;
            font-size: 14px;
            display: flex;
            gap: 15px;
        }

        .basemap-switcher label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .basemap-switcher input {
            cursor: pointer;
        }

        .lang-select {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        .layer-control {
            position: absolute;

            backdrop-filter: blur(4px);

        }

        .layer-control button,
        .layer-control select {
            display: block;
            width: 100%;
            margin: 6px 0;
            padding: 8px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 8px;

            backdrop-filter: blur(4px);
            max-width: 280px;
            z-index: 1000;
            display: none;
        }

        .legend span {
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-right: 8px;
            border-radius: 3px;
        }

        .report-panel {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(100,100,100,0.9);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 12px;
            width: 340px;
            z-index: 1001;
            color: white;
            font-size: 13px;
            display: none;
        }
    </style>
</head>

<body>

<div id="loginModal" class="login-modal">
    <div class="login-box">
        <h2>LUPANE LAND USE & WILDLIFE MONITOR</h2>

        <div class="welcome-msg">
            Welcome back, please login with your credentials to access the web map.
        </div>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">

        <button id="loginBtn">Enter Map</button>

        <div id="loginError" class="error-msg"></div>
    </div>
</div>

<div id="mapContainer" class="map-container">

    <div class="header">

        <div class="icon-group">
            <button class="icon-btn" id="menuIcon">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <div class="map-title">
            LUPANE LAND USE & WILDLIFE MONITOR
        </div>

        <div class="basemap-switcher">
            <label>
                <input type="radio" name="basemap" value="map" checked>
                🗺️ Map
            </label>

            <label>
                <input type="radio" name="basemap" value="satellite">
                🛰️ Satellite
            </label>
        </div>

    </div>

    <div id="map"></div>

    <div class="legend" id="legendPanel"></div>

    <div class="layer-control" id="layerControl">

        <strong>LAYERS</strong>
        <hr>

        <select id="lulcDropdown">
            <option value="">-- LAND USE LAND COVER --</option>
            <option value="2010">LAND USE LAND COVER 2010</option>
            <option value="2015">LAND USE LAND COVER 2015</option>
            <option value="2020">LAND USE LAND COVER 2020</option>
            <option value="2026">LAND USE LAND COVER 2026</option>
        </select>

        <button id="lupaneDistrictBtn">LUPANE BOUNDARY DISTRICT</button>
        <button id="roadsBtn">ROADS</button>
        <button id="damsBtn">DAMS</button>

    </div>

</div>

<script>

const loginModal = document.getElementById('loginModal');
const mapContainer = document.getElementById('mapContainer');
const loginBtn = document.getElementById('loginBtn');

const correctUser = 'web gis';
const correctPass = '@2026';

loginBtn.onclick = () => {

    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();

    if (u === correctUser && p === correctPass) {

        loginModal.style.display = 'none';
        mapContainer.style.display = 'block';

        initMap();

    } else {

        document.getElementById('loginError').innerText =
            'Invalid username or password.';
    }
};

let map;
let activeLayers = {};
let currentBaseLayer = null;

const osmLayer = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
);

const satelliteLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Esri'
    }
);

function switchBaseLayer(type) {

    if (currentBaseLayer) {
        map.removeLayer(currentBaseLayer);
    }

    currentBaseLayer = (type === 'map')
        ? osmLayer
        : satelliteLayer;

    currentBaseLayer.addTo(map);
}

function initMap() {

    map = L.map('map').setView([-18.92, 27.55], 10);

    currentBaseLayer = osmLayer;
    currentBaseLayer.addTo(map);

    // =========================
    // LAND USE LAND COVER PNG
    // =========================

    const imageBounds = [
        [-19.05, 27.35],
        [-18.80, 27.70]
    ];

    activeLayers.lulc2010 = L.imageOverlay(
        'LAND USE LAND COVER 2010.png',
        imageBounds,
        { opacity: 0.8 }
    );

    activeLayers.lulc2015 = L.imageOverlay(
        'LAND USE LAND COVER 2015.png',
        imageBounds,
        { opacity: 0.8 }
    );

    activeLayers.lulc2020 = L.imageOverlay(
        'LAND USE LAND COVER 2020.png',
        imageBounds,
        { opacity: 0.8 }
    );

    activeLayers.lulc2026 = L.imageOverlay(
        'LAND USE LAND COVER 2026.png',
        imageBounds,
        { opacity: 0.8 }
    );

    // =========================
    // BOUNDARY
    // =========================

    fetch('LUPANE BOUNDARY DISTRICT.geojson')
    .then(response => response.json())
    .then(data => {

        activeLayers.lupaneDistrict = L.geoJSON(data, {

            style: {
                color: '#000000',
                weight: 3,
                fillOpacity: 0
            }

        });

    });

    // =========================
    // ROADS
    // =========================

    fetch('ROADS.geojson')
    .then(response => response.json())
    .then(data => {

        activeLayers.roads = L.geoJSON(data, {

            style: {
                color: '#DB1E2A',
                weight: 2,
                dashArray: '4,12'
            }

        });

    });

    // =========================
    // DAMS
    // =========================

    fetch('DAM.geojson')
    .then(response => response.json())
    .then(data => {

        activeLayers.dams = L.geoJSON(data, {

            style: {
                color: '#232323',
                weight: 1,
                fillColor: '#0000FF',
                fillOpacity: 0.8
            }

        });

    });

    // =========================
    // TOGGLE FUNCTION
    // =========================

    function toggleLayer(name) {

        if (!activeLayers[name]) return;

        if (map.hasLayer(activeLayers[name])) {

            map.removeLayer(activeLayers[name]);

        } else {

            map.addLayer(activeLayers[name]);
        }

        updateLegend();
    }

    // =========================
    // LULC DROPDOWN
    // =========================

    document.getElementById('lulcDropdown').onchange = (e) => {

        const val = e.target.value;

        ['lulc2010','lulc2015','lulc2020','lulc2026']
        .forEach(layer => {

            if (
                activeLayers[layer] &&
                map.hasLayer(activeLayers[layer])
            ) {
                map.removeLayer(activeLayers[layer]);
            }

        });

        if (val === '2010') {
            map.addLayer(activeLayers.lulc2010);
        }

        if (val === '2015') {
            map.addLayer(activeLayers.lulc2015);
        }

        if (val === '2020') {
            map.addLayer(activeLayers.lulc2020);
        }

        if (val === '2026') {
            map.addLayer(activeLayers.lulc2026);
        }

        updateLegend();
    };

    // =========================
    // BUTTONS
    // =========================

    document.getElementById('lupaneDistrictBtn').onclick =
        () => toggleLayer('lupaneDistrict');

    document.getElementById('roadsBtn').onclick =
        () => toggleLayer('roads');

    document.getElementById('damsBtn').onclick =
        () => toggleLayer('dams');

    // =========================
    // LEGEND
    // =========================

    function updateLegend() {

        const legendDiv = document.getElementById('legendPanel');

        let content = '';

        const lulcVisible =
            map.hasLayer(activeLayers.lulc2010) ||
            map.hasLayer(activeLayers.lulc2015) ||
            map.hasLayer(activeLayers.lulc2020) ||
            map.hasLayer(activeLayers.lulc2026);

        if (lulcVisible) {

            content += `
            <strong>LAND COVER</strong><br>

            <p><span style="background:#f9a825;"></span> Farmland</p>

            <p><span style="background:#2e7d32;"></span> Forest</p>

            <p><span style="background:#8bc34a;"></span> Grassland</p>

            <p><span style="background:#1565c0;"></span> Water</p>

            <p><span style="background:#c62828;"></span> Urban</p>

            <p><span style="background:#757575;"></span> Bare Ground</p>

            <hr>
            `;
        }

        if (
            activeLayers.lupaneDistrict &&
            map.hasLayer(activeLayers.lupaneDistrict)
        ) {

            content += `
            <strong>LUPANE DISTRICT</strong><br>
            <p><span style="background:#000000;"></span> Boundary</p>
            <hr>
            `;
        }

        if (
            activeLayers.roads &&
            map.hasLayer(activeLayers.roads)
        ) {

            content += `
            <strong>ROADS</strong><br>
            <p><span style="background:#DB1E2A;"></span> Road Network</p>
            <hr>
            `;
        }

        if (
            activeLayers.dams &&
            map.hasLayer(activeLayers.dams)
        ) {

            content += `
            <strong>DAMS</strong><br>
            <p><span style="background:#0000FF;"></span> Dams</p>
            <hr>
            `;
        }

        if (content !== '') {

            legendDiv.innerHTML = content;
            legendDiv.style.display = 'block';

        } else {

            legendDiv.style.display = 'none';
        }
    }

    // =========================
    // BASEMAP SWITCHER
    // =========================

    document.querySelector('input[value="map"]')
    .addEventListener('change', () => {
        switchBaseLayer('map');
    });

    document.querySelector('input[value="satellite"]')
    .addEventListener('change', () => {
        switchBaseLayer('satellite');
    });

    // =========================
    // MENU BUTTON
    // =========================

    document.getElementById('menuIcon').onclick = () => {

        let panel = document.getElementById('layerControl');

        panel.style.display =
            panel.style.display === 'none'
            ? 'block'
            : 'none';
    };

}

</script>

</body>
</html>
