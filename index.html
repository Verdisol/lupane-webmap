<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lupane Land Use & Wildlife Monitor</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* (all styles same as before – keep your existing CSS) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .login-modal { /* ... same ... */ }
        /* ... paste your full CSS from previous working version ... */
    </style>
</head>
<body>
<!-- LOGIN MODAL (same as before) -->
<div id="loginModal" class="login-modal">...</div>

<div id="mapContainer" class="map-container">
    <div class="header">...</div>
    <div id="map"></div>
    <div class="legend" id="legendPanel"></div>
    <div class="layer-control" id="layerControl">...</div>
    <div class="report-panel" id="reportPanel">...</div>
</div>

<script>
    // ==================== LOGIN (unchanged) ====================
    // ... keep your login logic exactly as before ...

    // ==================== MAP INIT (fixed boundary loading) ====================
    function initMap() {
        map = L.map('map').setView([-18.92, 27.55], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

        function loadGeoJSON(name, url, style, popupField='name') {
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    activeLayers[name] = L.geoJSON(data, { style: style, onEachFeature: (f,l) => {
                        if(f.properties) l.bindPopup(f.properties[popupField] || f.properties.NAME || name);
                    } });
                    console.log(`✅ Loaded: ${name}`);
                    // Auto-add Lupane District when loaded
                    if (name === 'lupaneDistrict') {
                        activeLayers[name].addTo(map);
                        updateLegend();
                    }
                })
                .catch(err => console.warn(`❌ Could not load ${url}:`, err));
        }

        // Load all layers (use exact file names)
        loadGeoJSON('lupaneDistrict', 'LUPANE DISTRICT.geojson', { color: '#e63946', weight: 4, fillOpacity: 0, dashArray: '6,6' });
        loadGeoJSON('nationalParks', 'NATIONAL PARKS.geojson', { color: '#ff6600', weight: 2, fillOpacity: 0.3 });
        loadGeoJSON('protectedAreas', 'PROTECTED AREAS WITHIN LUPANE.geojson', { color: '#00ced1', weight: 2, fillOpacity: 0.3 });
        loadGeoJSON('farmBoundaries', 'LUPANE COMMUNAL FARM BOUNDARIES.geojson', { color: '#cddc39', weight: 2, fillOpacity: 0.4 });
        loadGeoJSON('rivers', 'RIVERS.geojson', { color: '#1e88e5', weight: 2, fillOpacity: 0 });
        loadGeoJSON('waterLines', 'WATER LINES.geojson', { color: '#42a5f5', weight: 2, fillOpacity: 0 });
        loadGeoJSON('roads', 'ROADS.geojson', { color: '#8d6e63', weight: 2, fillOpacity: 0 });

        // LULC placeholder groups
        activeLayers.lulc2010 = L.layerGroup();
        activeLayers.lulc2015 = L.layerGroup();
        activeLayers.lulc2020 = L.layerGroup();
        activeLayers.lulc2026 = L.layerGroup();

        // Fallback: if after 3 seconds the Lupane boundary still isn't loaded, add a drawn polygon
        setTimeout(() => {
            if (!activeLayers.lupaneDistrict || !map.hasLayer(activeLayers.lupaneDistrict)) {
                console.warn("LUPANE DISTRICT.geojson not loaded. Adding fallback polygon.");
                var fallback = L.polygon([
                    [27.40, -18.80], [27.65, -18.80], [27.70, -18.90],
                    [27.65, -19.05], [27.40, -19.05], [27.35, -18.95], [27.40, -18.80]
                ], { color: '#e63946', weight: 4, fillOpacity: 0, dashArray: '6,6' }).addTo(map);
                fallback.bindPopup("Lupane District (fallback boundary)");
                activeLayers.lupaneDistrict = fallback;
                updateLegend();
            }
        }, 3000);

        // Toggle function & legend update (same as before)
        function toggleLayer(name) {
            if(!activeLayers[name]) { alert(`Layer ${name} not loaded`); return; }
            if(map.hasLayer(activeLayers[name])) map.removeLayer(activeLayers[name]);
            else map.addLayer(activeLayers[name]);
            updateLegend();
        }

        // ... rest of your toggle button assignments, legend building, report panel, etc. ...
        // (keep everything else identical to your last working version)
    }
</script>
</body>
</html>
